[package]
name = "empyrean-gate"
version = "0.4.0"
description = "GPU pattern generator and sACN output for the Empyrean Gate"
edition = "2024"
# Two binaries exist (app + engine-smoke); `tauri dev`'s bare `cargo run` needs this.
default-run = "empyrean-gate"

[lib]
name = "empyrean_gate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "empyrean-gate"
path = "src/main.rs"

[[bin]]
name = "engine-smoke"
path = "src/bin/engine_smoke.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
env_logger = "0.11.11"
futures-util = { version = "0.3.34", features = ["sink"] }
fs2 = "0.4.3"
local-ip-address = "0.6.13"
log = "0.4.33"
midir = "0.11.0"
notify = { version = "8.2.0", optional = true }
parking_lot = "0.12.5"
pollster = "1.0.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["stream"] }
rust-embed = { version = "8.12.0", features = ["compression"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
socket2 = { version = "0.6.5", features = ["all"] }
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2.4.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
tower-http = { version = "0.6.11", features = ["cors"] }
ureq = { version = "3.4.0", default-features = false, features = ["json", "rustls"] }
url = "2.5.8"
# sACN source identity (CID) — a real RFC 4122 v4 UUID, generated once and persisted.
uuid = { version = "1.24.1", features = ["v4"] }
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan"] }

# macOS has no native Vulkan; wgpu's plain `vulkan` feature is not implemented there
# and Instance::new panics. `vulkan-portability` routes Vulkan through MoltenVK —
# still Vulkan-only by design, no Metal fallback.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan-portability"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["shader-hot-reload"]
# Read WGSL from disk and rebuild the pipeline on change (pattern dev).
shader-hot-reload = ["dep:notify"]
# Enabled by `tauri build` for release; serves embedded frontend assets.
custom-protocol = ["tauri/custom-protocol"]

# Thin LTO: near-fat-LTO quality at a fraction of the link time (this app's hot
# paths are GPU compute + network I/O, so fat LTO buys nothing measurable and
# serializes a massive relink that CI caches can't help with).
[profile.release]
lto = "thin"
codegen-units = 4
